name: Test with specific Yarn version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "4.5.3"
          cache: false
      - name: Assert yarn is available
        run: |
          echo "Checking yarn is installed..."
          if ! command -v yarn &> /dev/null; then
            echo "FAIL: yarn command not found"
            exit 1
          fi
          echo "yarn found at: $(which yarn)"
          echo "PASS"
      - name: Assert yarn version matches requested version
        run: |
          YARN_VERSION=$(yarn --version)
          echo "yarn version: $YARN_VERSION"
          if [ "$YARN_VERSION" != "4.5.3" ]; then
            echo "FAIL: expected yarn version 4.5.3, got $YARN_VERSION"
            exit 1
          fi
          echo "PASS"
