name: Test usage without yarn.lock
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Node.js package without yarn.lock
        run: |
          # Create a minimal package.json for a fresh project
          cat > "$GITHUB_WORKSPACE/package.json" <<'EOF'
          {
            "name": "test-pkg",
            "version": "1.0.0",
            "private": true,
            "packageManager": "yarn@4.0.2"
          }
          EOF
          # Ensure no yarn.lock exists so the action takes the no-lockfile path
          rm -f "$GITHUB_WORKSPACE/yarn.lock"
          # Create a minimal .yarnrc.yml
          cat > "$GITHUB_WORKSPACE/.yarnrc.yml" <<'EOF'
          nodeLinker: node-modules
          EOF

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran (no-lockfile path skips cache)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a yarn.lock, the action warns and skips cache,
          # then runs yarn install with CI='' to avoid strict mode errors.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully without yarn.lock"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
